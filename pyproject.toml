[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-method-analyzer"
version = "0.1.0"
description = "Assess AI-assisted software development methods against a frozen methodology and a public reference baseline."
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
